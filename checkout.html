 +'<div class="tabs" style="grid-template-columns:repeat(3,1fr)">'+[['akun','Akun Saya'],['pesanan','Pesanan Saya'],['alamat','Alamat']].map(function(t){return'<button data-at="'+t[0]+'" class="'+(atab===t[0]?'on':'')+'">'+t[1]+'</button>'}).join('')+'</div>';
 if(atab==='akun'){h+='<div class="card"><h2>Akun Saya</h2><label>Nama lengkap</label><input id="pn" value="'+esc(u.nama)+'"><label>No. HP</label><input id="ph" type="tel" value="'+esc(u.hp)+'"><label>Email</label><input value="'+esc(u.email)+'" disabled><button class="btn" id="svp">Simpan perubahan</button></div><div class="card"><h3>Keanggotaan</h3>'+(isMem()?'<p>✓ Member aktif. Harga member dipakai di checkout.</p><button class="cp" id="mboff">Nonaktifkan</button>':'<p class="mut">Punya kode member? Masukkan untuk mengaktifkan harga member.</p><div style="display:flex;gap:8px"><input id="mbk" placeholder="Kode member"><button class="cp" id="mbon">Aktifkan</button></div>')+'</div><a class="btn o" href="index.html">Lanjut belanja</a>'}
 if(atab==='pesanan'){var F=[['all','Semua',null],['b','Belum bayar','Menunggu pembayaran'],['p','Diproses','Diproses'],['k','Dikirim','Dikirim'],['s','Selesai','Selesai']];
  h+='<h2>Pesanan Saya</h2><div style="display:flex;gap:18px;overflow-x:auto;border-bottom:1px solid var(--ln);margin:14px 0">'+F.map(function(f){return'<button data-of="'+f[0]+'" style="white-space:nowrap;background:none;border:0;border-bottom:2px solid '+(ofil===f[0]?'var(--ink)':'transparent')+';padding:10px 0;font:'+(ofil===f[0]?'700':'500')+' 1rem DM Sans,sans-serif;color:'+(ofil===f[0]?'var(--ink)':'var(--mut)')+';cursor:pointer">'+f[1]+'</button>'}).join('')+'</div>';
  var fs=F.filter(function(f){return f[0]===ofil})[0][2],L=os.filter(function(o){return!fs||o.status===fs});

  h+='<p class="mut" style="font-size:.85rem">Status diperbarui toko setelah pembayaran diverifikasi.</p>'}
 if(atab==='alamat')h+=addrHTML();
 $('app').innerHTML=h;if(atab==='alamat')bindAddr()}
document.addEventListener('click',function(e){var t=e.target,i=t.id,g;function c(q){return t.closest?t.closest(q):null}
 if(g=c('[data-go]')){e.preventDefault();view=g.dataset.go;render()}
 if(g=c('[data-at]')){atab=g.dataset.at;view='akun';render()}
 if(g=c('[data-of]')){ofil=g.dataset.of;render()}
 if(g=c('[data-vi]')){ord=ls(uk('hq_orders'),[]).filter(function(o){return o.no===g.dataset.vi})[0];if(ord){view='inv';render();scrollTo(0,0)}}
 if(g=c('[data-vo]')){ord=ls(uk('hq_orders'),[]).filter(function(o){return o.no===g.dataset.vo})[0];if(ord){view='pay';render();scrollTo(0,0)}}
 if(i==='acc'){if(user){view='akun';atab='akun'}else{gate=false;view='login'}render()}
 if(i==='lo'){user=null;st={};try{localStorage.removeItem('hq_user');localStorage.removeItem('hq_co')}catch(x){}addrs=[];view='login';render()}
 if(i==='mo'){view='akun';atab='pesanan';render();scrollTo(0,0)}
 if(i==='mbon'){if(mbHash($('mbk').value)===MB_H){try{localStorage.setItem('hq_member_v2',MB_H)}catch(x){}toast('Member aktif. Harga member dipakai.');render()}else toast('Kode member salah. Cek pesan sematan di grup WhatsApp.')}
 if(i==='mboff'){try{localStorage.removeItem('hq_member_v2')}catch(x){}toast('Mode member dinonaktifkan.');render()}
 if(i==='svp'){user.nama=$('pn').value.trim()||user.nama;user.hp=$('ph').value.trim();sv('hq_user',user);var us=ls('hq_users',[]);us.forEach(function(x){if(x.id===user.id){x.nama=user.nama;x.hp=user.hp}});sv('hq_users',us);toast('Perubahan tersimpan');render()}});
if(location.hash==='#akun')view='akun';
loadU();
render();
