name: Ekstrak zip situs
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak semua file zip di folder utama
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Mengekstrak $z"
            unzip -o -q "$z"
            rm "$z"
          done
      - name: Simpan hasil ekstrak
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Ekstrak zip situs"
          git push
